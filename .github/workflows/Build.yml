name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix flat file layout
        run: |
          mkdir -p src/main/java/com/thegildedking/voidstasis src/main/resources gradle/wrapper
          [ -f VoidStasisPlugin.java ] && mv VoidStasisPlugin.java src/main/java/com/thegildedking/voidstasis/ || true
          [ -f plugin.yml ] && mv plugin.yml src/main/resources/ || true
          [ -f gradle-wrapper.jar ] && mv gradle-wrapper.jar gradle/wrapper/ || true
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/ || true
          find . -path ./.git -prune -o -type f -not -path './.gradle/*' -print | sort

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: VoidStasis-plugin
          path: build/libs/VoidStasis-*.jar
