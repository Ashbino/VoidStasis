name: VoidStasis
version: '${version}'
main: com.thegildedking.voidstasis.VoidStasisPlugin
api-version: '1.21'
author: TheGildedKing
description: Tag players with a hooked Ender Pearl, then reel them into the Void Stasis dimension.

commands:
  voidstasis:
    description: Void Stasis admin commands
    usage: "/voidstasis give [player]"
    permission: voidstasis.admin

permissions:
  voidstasis.admin:
    description: Lets you give out the Void Stasis item and use admin commands
    default: op
