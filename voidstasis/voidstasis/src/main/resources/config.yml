# How close (in blocks) a thrown Ender Pearl must get to your Void Stasis bobber
# to count as hooked. Pearls are fast, so keep this at 1.5 or more.
pearl-hook-radius: 2.0

# If true, you can tag yourself by hooking your own pearl (handy for solo testing).
allow-self-tag: false

# What happens when you reel in a player you have tagged:
#   drop = teleport them below the bottom of the world (same spot) so they fall into the void and die
#   kill = kill them instantly
#   void = send them to the Void Stasis world (needs a restart to create the world)
on-reel: drop

# Folder name of the Void Stasis world (only used when on-reel is void).
stasis-world: voidstasis
